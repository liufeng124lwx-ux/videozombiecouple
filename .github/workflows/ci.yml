name: ci

permissions:
  contents: read

on:
  pull_request:
  # deploy.yml runs this on every push to main before deploying.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @vzc/web verify
      - run: pnpm --filter @vzc/api dryrun
      - run: pnpm --filter @vzc/api exec wrangler deploy --dry-run -c wrangler.production.jsonc --outdir dist-production

  # Spec 11.2: the story journey in headless Chromium against a scripted API, and Lighthouse on
  # the production build.
  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: uv run pytest -q
        working-directory: apps/composer

  browser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vzc/web exec playwright install --with-deps chromium
      - run: pnpm --filter @vzc/web e2e
      - run: pnpm --filter @vzc/web lighthouse
