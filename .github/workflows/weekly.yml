name: weekly

# Spec 8.5 / 11.2: a D1 export to the private backups bucket (kept 12 weeks by its lifecycle
# rule), and a dependency security check. The remote export makes D1 briefly unavailable, so it
# runs at 05:00 UTC on Monday, the quietest hour.

permissions:
  contents: read

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    # Its own environment without required reviewers: the production one would hold every
    # scheduled run until someone approves it, and the backups would silently stop.
    environment: backups
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export and upload
        working-directory: apps/api
        run: |
          file="d1-$(date -u +%F).sql"
          pnpm exec wrangler d1 export DB --remote -c wrangler.production.jsonc --output "$RUNNER_TEMP/$file"
          gzip "$RUNNER_TEMP/$file"
          pnpm exec wrangler r2 object put "vzc-backups/d1/$file.gz" --file "$RUNNER_TEMP/$file.gz" --remote

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm audit --prod --audit-level high
