name: deploy

# Spec 11.2: every push to main → checks → staging → smoke (one real kie job). Production is the
# manual approval: it runs only when someone starts this workflow by hand (Actions → deploy → Run
# workflow), after staging and its smoke pass again. A private repo on GitHub's free plan has no
# environment reviewers, so the manual start is the gate.
# Order per environment: D1 migrations → route sync → API → site. A failing step stops the run.

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  staging:
    needs: checks
    # Skipped (not failed) until the Cloudflare account is set up (docs/launch-checklist.md).
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: D1 migrations
        run: pnpm --filter @vzc/api exec wrangler d1 migrations apply DB --remote -c wrangler.jsonc
        env:
          CI: "1"
      - name: Route sync (catalog columns; the admin's switches, order and timeouts stay)
        run: |
          pnpm --filter @vzc/api route-sync "$RUNNER_TEMP/routes.sql"
          pnpm --filter @vzc/api exec wrangler d1 execute DB --remote -c wrangler.jsonc --file "$RUNNER_TEMP/routes.sql"
      - name: API
        run: pnpm --filter @vzc/api exec wrangler deploy -c wrangler.jsonc
      - name: Site
        env:
          PUBLIC_API_ORIGIN: https://api-staging.videozombiecouple.com
          PUBLIC_SITE_ORIGIN: https://staging.videozombiecouple.com
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.STAGING_TURNSTILE_SITE_KEY }}
          PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN_WEB }}
        run: |
          pnpm --filter @vzc/web build
          pnpm --filter @vzc/web exec wrangler deploy -c wrangler.jsonc
      - name: Smoke (one real standard job, about $0.016)
        env:
          SMOKE_REAL_JOB: "1"
          SMOKE_KEY: ${{ secrets.STAGING_SMOKE_KEY }}
        run: pnpm --filter @vzc/web exec tsx scripts/smoke.ts https://api-staging.videozombiecouple.com https://staging.videozombiecouple.com

  production:
    needs: staging
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Live sitemap before the deploy (for IndexNow)
        run: pnpm --filter @vzc/web exec tsx scripts/indexnow.ts snapshot https://videozombiecouple.com "$RUNNER_TEMP/before.xml"
      - name: D1 migrations
        run: pnpm --filter @vzc/api exec wrangler d1 migrations apply DB --remote -c wrangler.production.jsonc
        env:
          CI: "1"
      - name: Route sync (catalog columns; the admin's switches, order and timeouts stay)
        run: |
          pnpm --filter @vzc/api route-sync "$RUNNER_TEMP/routes.sql"
          pnpm --filter @vzc/api exec wrangler d1 execute DB --remote -c wrangler.production.jsonc --file "$RUNNER_TEMP/routes.sql"
      - name: API
        run: pnpm --filter @vzc/api exec wrangler deploy -c wrangler.production.jsonc
      - name: Site
        env:
          PUBLIC_API_ORIGIN: https://api.videozombiecouple.com
          PUBLIC_SITE_ORIGIN: https://videozombiecouple.com
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PRODUCTION_TURNSTILE_SITE_KEY }}
          PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN_WEB }}
          PUBLIC_GA4_ID: ${{ vars.GA4_ID }}
          PUBLIC_CLARITY_ID: ${{ vars.CLARITY_ID }}
          PUBLIC_ADS_ENABLED: ${{ vars.ADS_ENABLED }}
        run: |
          pnpm --filter @vzc/web build:production
          pnpm --filter @vzc/web exec wrangler deploy -c wrangler.production.jsonc
      - name: Smoke (no real job in production)
        run: pnpm --filter @vzc/web exec tsx scripts/smoke.ts https://api.videozombiecouple.com https://videozombiecouple.com
      - name: IndexNow (new pages only)
        run: pnpm --filter @vzc/web exec tsx scripts/indexnow.ts submit "$RUNNER_TEMP/before.xml" dist
