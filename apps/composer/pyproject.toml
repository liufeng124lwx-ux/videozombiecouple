[project]
name = "vzc-composer"
version = "0.1.0"
description = "Scoring and ffmpeg compose for VideoZombieCouple (Cloudflare Container)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "httpx==0.28.1",
  "pillow==11.0.0",
  "numpy<2.1",
  "opencv-python-headless==4.10.0.84",
  "onnxruntime==1.20.1",
  "insightface==0.7.3",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
